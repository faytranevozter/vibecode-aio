name: CI

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - VERSION
      - package.json
      - .github/workflows/**
      - scripts/**
      - tests/docker-workflow/**
      - README.md
      - docs/adr/**
      - opencode.default.json
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - VERSION
      - package.json
      - .github/workflows/**
      - scripts/**
      - tests/docker-workflow/**
      - README.md
      - docs/adr/**
      - opencode.default.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read package versions from Dockerfile
        id: versions
        run: |
          ninerouter=$(sed -n 's/^ARG NINEROUTER_VERSION=//p' Dockerfile | head -n1)
          opencode=$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile | head -n1)
          openchamber=$(sed -n 's/^ARG OPENCHAMBER_VERSION=//p' Dockerfile | head -n1)
          app=$(tr -d '[:space:]' < VERSION)
          echo "ninerouter=${ninerouter}" >> "$GITHUB_OUTPUT"
          echo "opencode=${opencode}" >> "$GITHUB_OUTPUT"
          echo "openchamber=${openchamber}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: debian
          push: false
          load: true
          tags: vibecode-aio:ci
          build-args: |
            NINEROUTER_VERSION=${{ steps.versions.outputs.ninerouter }}
            OPENCODE_VERSION=${{ steps.versions.outputs.opencode }}
            OPENCHAMBER_VERSION=${{ steps.versions.outputs.openchamber }}
          cache-from: type=gha,scope=ci-debian
          cache-to: type=gha,mode=max,scope=ci-debian

      - name: Smoke CLI versions
        run: |
          docker run --rm --entrypoint sh vibecode-aio:ci -c \
            'node --version && opencode --version && openchamber --version && 9router --version && ! command -v dockerd && [ ! -S /var/run/docker.sock ]'

      - name: Test Docker-enabled launcher
        run: tests/docker-workflow/launcher.sh

      - name: Smoke external Docker workflow
        run: |
          cleanup() {
            docker rm -f vibecode-aio >/dev/null 2>&1 || true
            if [ -n "${launcher_pid:-}" ]; then
              kill "$launcher_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          VIBECODE_ENV_FILE="$PWD/.env.example" \
            VIBECODE_IMAGE=vibecode-aio:ci \
            scripts/run-with-docker.sh &
          launcher_pid=$!

          for attempt in $(seq 1 30); do
            if docker inspect vibecode-aio >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker inspect vibecode-aio >/dev/null
          docker exec vibecode-aio sh tests/docker-workflow/smoke.sh
